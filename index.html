<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Math Tutor — Professor Pi</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Space+Mono:wght@400;700&family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>


  <div class="board-grain"></div>


  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">∑</span>
        <div class="logo-text">
          <span class="logo-title">Professor Pi</span>
          <span class="logo-sub">AI Math Tutor</span>
        </div>
      </div>

      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span class="status-label">Checking…</span>
      </div>
    </div>
  </header>


  <main class="chat-wrapper">
    <div class="chat-box" id="chatBox">


      <div class="message bot-message welcome-msg">
        <div class="avatar">π</div>
        <div class="bubble">
          <p class="greeting">Hello, I'm Professor Pi! 👋</p>
          <p>Give me any math problem and I'll walk you through it step by step.</p>
        </div>
      </div>

    </div>
  </main>


  <footer class="input-bar">
    <div class="input-inner">
      <textarea
        id="userInput"
        class="input-field"
        placeholder="Type a math problem… (Enter to send)"
        rows="1"
        maxlength="500"
        autocomplete="off"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
